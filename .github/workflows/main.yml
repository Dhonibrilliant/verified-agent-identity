name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Install Verified Agent Identity Skill
        run: |
          for i in 1 2 3
          do
            clawhub install verified-agent-identity && break
            echo "Retry $i failed. Waiting 20 seconds..."
            sleep 20
          done

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"Dhoni","description":"Dhoni AI Agent"}'
